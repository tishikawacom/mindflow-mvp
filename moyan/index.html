<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="不安、反芻時間、取った行動と結果を記録するアプリ。">
  <title>moyan — 不安の記録</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="wordmark">moyan<span>.</span></span></div>
      <nav class="nav" id="sideNav" aria-label="メインナビゲーション">
        <button data-view="home" class="nav-btn active"><span class="icon icon-home" aria-hidden="true"></span>ホーム</button>
        <button data-view="worries" class="nav-btn"><span class="icon icon-records" aria-hidden="true"></span>不安の記録</button>
        <button data-view="insights" class="nav-btn"><span class="icon icon-insights" aria-hidden="true"></span>分析</button>
        <button data-view="settings" class="nav-btn"><span class="icon icon-settings" aria-hidden="true"></span>設定</button>
      </nav>
    </aside>
    <div class="main-wrap">
      <header class="top">
        <div class="mobile-brand wordmark">moyan<span>.</span></div>
        <div class="top-right"><span class="privacy-dot" aria-hidden="true"></span><span id="storageLabel">この端末に保存</span></div>
      </header>
      <main id="appContent" class="content" tabindex="-1"></main>
    </div>
    <nav class="bottom" id="bottomNav" aria-label="メインナビゲーション">
      <button data-view="home" class="active"><span class="icon icon-home" aria-hidden="true"></span><span>ホーム</span></button>
      <button data-view="worries"><span class="icon icon-records" aria-hidden="true"></span><span>記録</span></button>
      <button data-view="insights"><span class="icon icon-insights" aria-hidden="true"></span><span>分析</span></button>
      <button data-view="settings"><span class="icon icon-settings" aria-hidden="true"></span><span>設定</span></button>
    </nav>
  </div>
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal-sheet" id="modalContent" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"></div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
