<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<meta name="description" content="不安をほどいて、時間を取り戻す。予測・アクション・結果を記録するプライベートなセルフケアツール。">
<title>moyan — 不安をほどく</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">
<div class="brand-icon">m</div>
<div>
<strong>moyan</strong>
<span>不安をほどく、毎日へ。</span>
</div>
</div>
<nav class="nav" id="sideNav" aria-label="メインナビゲーション">
<button data-view="home" class="nav-btn active">
<span>⌂</span>ホーム</button>
<button data-view="worries" class="nav-btn">
<span>☷</span>不安の記録</button>
<button data-view="insights" class="nav-btn">
<span>▥</span>振り返り</button>
<button data-view="settings" class="nav-btn">
<span>⚙</span>設定</button>
</nav>
<div class="side-foot">自分のペースで、大丈夫。<small>このアプリは医療・診断サービスではありません。</small>
</div>
</aside>
<div class="main-wrap">
<header class="top">
<div class="mobile-brand">
<div class="brand-icon">m</div>
<strong>moyan</strong>
</div>
<div class="top-right">
<span class="privacy-dot">
</span> <span id="storageLabel">記録はこの端末だけに保存</span></div>
</header>
<main id="appContent" class="content" tabindex="-1">
</main>
</div>
<nav class="bottom" id="bottomNav" aria-label="メインナビゲーション">
<button data-view="home" class="active">
<span class="nav-icon" aria-hidden="true">⌂</span>
<span>ホーム</span>
</button>
<button data-view="worries">
<span class="nav-icon" aria-hidden="true">☷</span>
<span>記録</span>
</button>
<button data-view="insights">
<span class="nav-icon" aria-hidden="true">▥</span>
<span>分析</span>
</button>
<button data-view="settings">
<span class="nav-icon" aria-hidden="true">⚙</span>
<span>設定</span>
</button>
</nav>
</div>
<div id="modal" class="modal-backdrop" hidden>
<div class="modal-sheet" id="modalContent" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
</div>
</div>
<script src="./app.js" defer>
</script>
</body>
</html>
