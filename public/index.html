<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta
      name="description"
      content="思考を軽やかに広げる、ローカル保存対応のシンプルなマインドマップ。"
    />
    <title>Mindflow — シンプルなマインドマップ</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Mindflow ホーム">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>Mindflow</span>
        </a>

        <div class="save-state" role="status" aria-live="polite">
          <span class="save-dot" aria-hidden="true"></span>
          <span id="saveLabel">この端末に保存済み</span>
        </div>

        <button class="button button-primary top-add" id="addRootButton" type="button">
          <span aria-hidden="true">＋</span>
          新しいテーマ
        </button>
      </header>

      <main class="workspace-wrap">
        <aside class="toolbar" aria-label="編集ツール">
          <button class="tool-button" id="addChildButton" type="button" disabled>
            <span class="tool-icon" aria-hidden="true">＋</span>
            <span>子ノード</span>
          </button>
          <button class="tool-button" id="renameButton" type="button" disabled>
            <span class="tool-icon" aria-hidden="true">✎</span>
            <span>名前変更</span>
          </button>
          <button class="tool-button tool-danger" id="deleteButton" type="button" disabled>
            <span class="tool-icon" aria-hidden="true">×</span>
            <span>削除</span>
          </button>
          <span class="tool-separator" aria-hidden="true"></span>
          <button class="tool-button" id="undoButton" type="button" disabled>
            <span class="tool-icon" aria-hidden="true">↶</span>
            <span>戻す</span>
          </button>
          <button class="tool-button" id="resetButton" type="button">
            <span class="tool-icon" aria-hidden="true">↻</span>
            <span>リセット</span>
          </button>
        </aside>

        <section
          class="viewport"
          id="viewport"
          aria-label="マインドマップ編集エリア"
          tabindex="0"
        >
          <div class="canvas" id="canvas">
            <svg class="connections" id="connections" aria-hidden="true">
              <defs>
                <filter id="lineShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.12" />
                </filter>
              </defs>
            </svg>
            <div class="node-layer" id="nodeLayer"></div>
            <div class="empty-state" id="emptyState" hidden>
              <div class="empty-illustration" aria-hidden="true"><i></i><i></i><i></i></div>
              <h1>最初のアイデアを置きましょう</h1>
              <p>ひとつのテーマから、考えを自由に枝分かれさせられます。</p>
              <button class="button button-primary" id="emptyAddButton" type="button">テーマを追加</button>
            </div>
          </div>

          <div class="canvas-hint" id="canvasHint">
            ノードをドラッグして配置 · ダブルクリックで編集
          </div>
        </section>
      </main>

      <footer class="mobile-actions" aria-label="モバイル編集ツール">
        <button id="mobileAddChild" type="button" disabled><span aria-hidden="true">＋</span> 子ノード</button>
        <button id="mobileRename" type="button" disabled><span aria-hidden="true">✎</span> 編集</button>
        <button id="mobileDelete" type="button" disabled><span aria-hidden="true">×</span> 削除</button>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="confirm-dialog" id="confirmDialog">
      <form method="dialog">
        <div class="dialog-icon" aria-hidden="true">×</div>
        <h2>ノードを削除しますか？</h2>
        <p id="confirmMessage">このノードにつながる子ノードも削除されます。</p>
        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel">キャンセル</button>
          <button class="button button-danger" value="confirm">削除する</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
